<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12262E">
<title>Buku Kas</title>
<style>
  html, body { height: 100%; margin: 0; background: #EEF2F1; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>

<!-- GANTI dengan alamat /exec deployment Apps Script Anda -->
<iframe id="app" src="GANTI_DENGAN_ALAMAT_EXEC_ANDA" allow="clipboard-write"></iframe>

<script>
/*
  Tombol kembali Android: tidak keluar dari aplikasi.
  Tombol kembali diteruskan ke aplikasi Buku Kas (di dalam iframe) untuk menutup
  kalender/dialog/form dan menghapus kata kunci pencarian. Jika tidak ada yang bisa
  ditutup, tidak terjadi apa-apa.

  Jika wrapper Anda sudah punya index.html sendiri, cukup salin blok <script> ini
  ke sana (iframe pertama di halaman dipakai otomatis).
*/
(function () {
  var frame = document.querySelector('iframe');
  var terpasang = false;

  // Pasang satu entri riwayat penjaga. Harus setelah pengguna berinteraksi dengan halaman,
  // karena Chrome melewati entri riwayat yang dibuat tanpa interaksi pengguna.
  function pasang() {
    if (terpasang) return;
    terpasang = true;
    try { history.pushState({ bk: 1 }, ''); } catch (e) {}
  }

  // Sentuhan di dalam iframe juga dihitung sebagai interaksi untuk halaman ini
  var cek = setInterval(function () {
    if (navigator.userActivation && navigator.userActivation.hasBeenActive) {
      clearInterval(cek);
      pasang();
    }
  }, 300);
  document.addEventListener('pointerdown', pasang, true);
  window.addEventListener('message', function (e) {
    if (e.data && e.data.bk === 'siap') pasang();
  });

  // Teruskan pesan "kembali" ke aplikasi di dalam iframe
  function kirimKembali() {
    try {
      var luar = frame.contentWindow;              // halaman script.google.com
      for (var i = 0; i < luar.frames.length; i++) {
        luar.frames[i].postMessage({ bk: 'kembali' }, '*');   // frame kode aplikasi
      }
    } catch (e) {}
  }

  window.addEventListener('popstate', function () {
    if (!terpasang) return;
    kirimKembali();
    try { history.pushState({ bk: 1 }, ''); } catch (e) {}   // pasang lagi agar tetap di aplikasi
  });
})();
</script>
</body>
</html>
