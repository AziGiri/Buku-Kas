<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buku Kas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12262E; --ink-2:#1F3F4B; --paper:#EEF2F1; --surface:#FFFFFF;
  --line:#D8E0DE; --text:#12262E; --muted:#587076;
  --in:#0E7C5F; --in-soft:#DDF1EA; --out:#C13F3A; --out-soft:#F8E3E1;
  --focus:#2F6FED;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;
  font-variant-numeric:tabular-nums;
}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* progress */
#load{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;overflow:hidden}
#load::before{content:"";display:block;height:100%;width:30%;background:var(--focus);animation:geser 1s ease-in-out infinite}
@keyframes geser{from{transform:translateX(-100%)}to{transform:translateX(340%)}}

/* buttons & inputs */
.btn{height:46px;padding:0 20px;border-radius:10px;border:0;font-weight:700;background:var(--ink);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.in{background:var(--in)} .btn.out{background:var(--out)}
.btn.small{height:40px;padding:0 16px;font-size:14px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:14px}
.input{height:46px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:0 14px}
.input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(47,111,237,.25)}
.err{color:var(--out);font-size:14px;font-weight:600;min-height:22px;margin-bottom:8px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:380px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.login .mark{margin-bottom:28px}
.login h1{font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.login .sub{color:var(--muted);margin-bottom:28px}
.pwwrap{position:relative}
.pwwrap .input{padding-right:96px}
.pwwrap button{position:absolute;right:6px;top:6px;height:34px;padding:0 12px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;border-radius:8px}
.pwwrap button:hover{background:var(--paper)}
.login .btn{width:100%}

/* shell */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#fff;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 28px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .mark{background:var(--ink-2);width:38px;height:38px;border-radius:10px}
.nav{display:grid;gap:4px}
.nav-btn{display:flex;gap:12px;align-items:center;width:100%;height:46px;padding:0 12px;border:0;background:transparent;color:#B9CBD1;border-radius:10px;font-weight:600;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn[aria-current="page"]{background:var(--ink-2);color:#fff}
.side-foot{margin-top:auto;display:grid;gap:4px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
.side-foot .nav-btn{height:40px;font-size:14px}
.main{padding:28px 36px 64px;max-width:1120px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.top-acts{display:none;gap:6px}
.upd{font-size:12px;font-weight:600;color:var(--muted);min-height:18px;margin-top:2px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center}
.bulan{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:999px;height:44px;padding:0 3px}
.bulan button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center}
.bulan button:hover{background:var(--paper)}
.bulan input{border:0;background:transparent;height:38px;width:160px;text-align:center;font-weight:700;padding:0 4px}
.bulan input:focus{outline:none}
.bulan:focus-within{border-color:var(--ink)}

.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--ink);grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{display:grid;justify-items:center;gap:2px;border:0;background:transparent;color:#B9CBD1;padding:6px 0;font-size:12px;font-weight:600;border-radius:10px}
.tabbar button[aria-current="page"]{color:#fff;background:var(--ink-2)}

/* dashboard */
.hero{background:var(--ink);color:#fff;border-radius:18px;padding:28px 30px 24px;margin-bottom:20px;position:sticky;top:10px;z-index:20;box-shadow:0 0 0 10px var(--paper)}
.hero .lbl{color:#A9BEC5;font-size:14px;font-weight:600}
.hero .num{font-size:clamp(34px,7vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 22px;overflow-wrap:anywhere}
.split{display:flex;gap:3px;height:12px;border-radius:999px;overflow:hidden;background:#2A4652}
.split i{display:block;height:100%}
.split .a{background:#2FBF94}.split .b{background:#F0625A}
.legend{display:flex;justify-content:space-between;gap:16px;margin-top:14px;flex-wrap:wrap}
.legend div{display:grid}
.legend .r{text-align:right}
.legend small{color:#A9BEC5;font-size:13px;font-weight:600}
.legend b{font-size:18px}
.legend .a b{color:#6FE0BC}.legend .r b{color:#FF9A92}

.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:20px}
.stat{padding:18px 22px}
.stat+.stat{border-left:1px solid var(--line)}
.stat small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.stat b{font-size:21px;font-weight:800}
.pos{color:var(--in)}.neg{color:var(--out)}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:20px}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .hint{color:var(--muted);font-size:13px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.two .panel{margin-bottom:0}

.ck{display:flex;gap:16px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:14px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.dot.in{background:var(--in)}.dot.out{background:var(--out)}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.col{display:flex;flex-direction:column;gap:8px;text-align:center}
.bars{height:150px;display:flex;align-items:flex-end;justify-content:center;gap:4px;border-bottom:1.5px solid var(--line)}
.b{display:block;width:min(22px,38%);border-radius:5px 5px 0 0}
.b.in{background:var(--in)}.b.out{background:var(--out)}
.col span{font-size:13px;color:var(--muted);font-weight:600}
.col.cur span{color:var(--text);font-weight:800}

.klist{list-style:none;padding:0;display:grid;gap:14px}
.k-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:6px}
.k-top span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-top em{font-style:normal;color:var(--muted);font-weight:500;margin-left:6px}
.k-top b{white-space:nowrap}
.k-bar{height:8px;background:#E6ECEA;border-radius:99px;overflow:hidden}
.k-bar i{display:block;height:100%;background:var(--out);border-radius:99px}

.rec{list-style:none;padding:0}
.rec li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rec li:first-child{border-top:0;padding-top:0}
.rec .t{display:grid;min-width:0}
.rec .t b{font-size:14px}
.rec .t small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.empty{padding:32px 20px;text-align:center;color:var(--muted)}
.panel .empty{padding:12px 0}

/* kartu rata-rata */
.avg{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:10px 0 6px;overflow-wrap:anywhere}
.avg small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.note{color:var(--muted);font-size:14px}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.rng .field{margin:0}
.rng .input{height:42px;padding:0 10px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip.sm{height:34px;padding:0 13px;font-size:13px}

/* laporan harian */
.lap{list-style:none;padding:0;max-height:440px;overflow-y:auto}
.lap li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.lap li:first-child{border-top:0;padding-top:0}
.lap .t{display:grid;min-width:0}
.lap .t small{color:var(--muted);font-size:13px}
.lap-total{display:flex;justify-content:space-between;gap:12px;margin-top:6px;padding-top:14px;border-top:2px solid var(--ink);font-weight:800}

/* daftar transaksi */
.bar{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.sum small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.sum b{font-size:32px;font-weight:800;letter-spacing:-.02em}
.sum.in b{color:var(--in)}.sum.out b{color:var(--out)}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools .input{max-width:320px;height:42px}
.chip{height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.table{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp-date{display:flex;justify-content:space-between;gap:12px;padding:12px 20px 6px;font-size:13px;font-weight:700;color:var(--muted);background:var(--paper)}
.grp:first-child .grp-date{border-top:0}
.row{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.grp:first-child .row:first-of-type{border-top:0}
.r-main{display:grid;min-width:0}
.r-main span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-act{display:flex;gap:2px}
.lnk{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px}
.lnk:hover{background:var(--paper);color:var(--text)}
.lnk.del:hover{background:var(--out-soft);color:var(--out)}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(440px,calc(100vw - 32px));background:#fff;color:var(--text);margin:auto}
dialog::backdrop{background:rgba(18,38,46,.55)}
.dlg{padding:26px}
.dlg h2{font-size:20px;font-weight:800;margin-bottom:18px;letter-spacing:-.01em}
.dlg p{color:var(--muted);margin-bottom:6px}
.dlg-act{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}

@media (max-width:820px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  .tabbar{display:grid}
  .top-acts{display:flex}
  .main{padding:18px 16px 100px}
  .top h1{font-size:24px}
  .bulan{order:3;width:100%;justify-content:space-between}
  .bulan input{flex:1;width:auto}
  .hero{padding:16px 18px 16px;top:8px;box-shadow:0 0 0 8px var(--paper)}
  .hero .num{font-size:clamp(28px,8vw,40px);margin:2px 0 12px}
  .legend{margin-top:10px}
  .legend b{font-size:16px}
  .stats{grid-template-columns:1fr}
  .stat{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px}
  .stat+.stat{border-left:0;border-top:1px solid var(--line)}
  .stat b{font-size:18px}
  .two{grid-template-columns:1fr}
  .two .panel+.panel{margin-top:20px}
  .row{grid-template-columns:1fr auto;grid-template-areas:"main amt" "act act";gap:4px 12px;padding:14px 16px}
  .r-main{grid-area:main}.r-amt{grid-area:amt}.r-act{grid-area:act;justify-content:flex-end}
  .toast{bottom:92px}
}
@media (prefers-reduced-motion:reduce){
  #load::before{animation:none;width:100%}
  .toast{transition:none}
}
</style>
</head>
<body>

<div id="load" hidden></div>

<!-- ================= LOGIN ================= -->
<div class="login" id="login">
  <div class="login-box">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24"><rect x="4" y="4" width="7" height="16" rx="2" fill="#2FBF94"/><rect x="13" y="9" width="7" height="11" rx="2" fill="#F0625A"/></svg>
    </div>
    <h1>Buku Kas</h1>
    <p class="sub">Masukkan password untuk membuka catatan keuangan Anda.</p>
    <form id="formLogin" autocomplete="off">
      <div class="field">
        <label for="pw">Password</label>
        <div class="pwwrap">
          <input class="input" id="pw" type="password" autocomplete="current-password" required autofocus>
          <button type="button" id="lihatPw" aria-label="Tampilkan password">Tampilkan</button>
        </div>
      </div>
      <div class="err" id="loginErr" role="alert" aria-live="polite"></div>
      <button class="btn" id="btnLogin" type="submit">Masuk</button>
    </form>
  </div>
</div>

<!-- ================= APLIKASI ================= -->
<div id="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="4" width="7" height="16" rx="2" fill="#2FBF94"/><rect x="13" y="9" width="7" height="11" rx="2" fill="#F0625A"/></svg></div>
      Buku Kas
    </div>
    <nav class="nav" aria-label="Menu utama">
      <button class="nav-btn" data-nav="dashboard"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
      <button class="nav-btn" data-nav="masuk"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uang masuk</button>
      <button class="nav-btn" data-nav="keluar"><svg class="ico" viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uang keluar</button>
    </nav>
    <div class="side-foot">
      <button class="nav-btn js-pw"><svg class="ico" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9m-3 3l3 3"/></svg>Ganti password</button>
      <button class="nav-btn js-out"><svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Keluar</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="ttl"><h1 id="judul">Dashboard</h1><div class="upd" id="upd" role="status" aria-live="polite"></div></div>
      <div class="top-acts">
        <button class="icon-btn js-pw" aria-label="Ganti password"><svg class="ico" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9m-3 3l3 3"/></svg></button>
        <button class="icon-btn js-out" aria-label="Keluar"><svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
      <div class="bulan">
        <button id="prev" aria-label="Bulan sebelumnya"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <input type="month" id="bulan" aria-label="Pilih bulan">
        <button id="next" aria-label="Bulan berikutnya"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </header>

    <div class="hero" id="hero" hidden></div>
    <section id="v-dashboard"></section>
    <section id="v-masuk" hidden></section>
    <section id="v-keluar" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Menu utama">
    <button data-nav="dashboard"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
    <button data-nav="masuk"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uang masuk</button>
    <button data-nav="keluar"><svg class="ico" viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Uang keluar</button>
  </nav>
</div>

<!-- ================= DIALOG TRANSAKSI ================= -->
<dialog id="dlgTrx" aria-labelledby="fTitle">
  <form class="dlg" id="formTrx" autocomplete="off">
    <h2 id="fTitle">Tambah uang masuk</h2>
    <div class="field"><label for="fTgl">Tanggal</label><input class="input" id="fTgl" type="date" required></div>
    <div class="field"><label for="fKat">Kategori</label><input class="input" id="fKat" list="dlKat" maxlength="60" required placeholder="Pilih atau ketik kategori"><datalist id="dlKat"></datalist></div>
    <div class="field"><label for="fJml">Jumlah (Rp)</label><input class="input" id="fJml" inputmode="numeric" required placeholder="0"></div>
    <div class="field"><label for="fKet">Keterangan (opsional)</label><input class="input" id="fKet" maxlength="200"></div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="dlg-act">
      <button type="button" class="btn ghost" data-tutup>Batal</button>
      <button type="submit" class="btn" id="fSimpan">Simpan</button>
    </div>
  </form>
</dialog>

<!-- ================= DIALOG HAPUS ================= -->
<dialog id="dlgDel">
  <div class="dlg">
    <h2>Hapus catatan ini?</h2>
    <p id="delInfo"></p>
    <p>Catatan yang dihapus tidak bisa dikembalikan.</p>
    <div class="dlg-act">
      <button type="button" class="btn ghost" data-tutup>Batal</button>
      <button type="button" class="btn out" id="delOk">Hapus</button>
    </div>
  </div>
</dialog>

<!-- ================= DIALOG PASSWORD ================= -->
<dialog id="dlgPw" aria-labelledby="pwTitle">
  <form class="dlg" id="formPw" autocomplete="off">
    <h2 id="pwTitle">Ganti password</h2>
    <div class="field"><label for="pLama">Password lama</label><input class="input" id="pLama" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="pBaru">Password baru (minimal 6 karakter)</label><input class="input" id="pBaru" type="password" autocomplete="new-password" minlength="6" required></div>
    <div class="field"><label for="pUlang">Ulangi password baru</label><input class="input" id="pUlang" type="password" autocomplete="new-password" required></div>
    <div class="err" id="pErr" role="alert"></div>
    <div class="dlg-act">
      <button type="button" class="btn ghost" data-tutup>Batal</button>
      <button type="submit" class="btn" id="pSimpan">Simpan password</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- util ---------- */
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  var nf = new Intl.NumberFormat('id-ID');
  var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var KATEGORI = {
    masuk: ['Gaji','Bonus','Usaha','Investasi','Hadiah','Lainnya'],
    keluar: ['Makan & minum','Transportasi','Belanja','Tagihan','Kesehatan','Pendidikan','Hiburan','Lainnya']
  };
  // Kategori yang tidak dihitung di laporan pengeluaran harian (huruf kecil semua)
  var KECUALI_LAPORAN = ['tagihan'];
  var JUDUL = { dashboard: 'Dashboard', masuk: 'Uang masuk', keluar: 'Uang keluar' };

  function p2(n) { return ('0' + n).slice(-2); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rp(n) { return 'Rp ' + nf.format(Math.abs(n)); }
  function rpS(n) { return (n < 0 ? '\u2212' : '') + rp(n); }
  function hariIni() { var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function akhirBulan(b) { var p = b.split('-'); return b + '-' + p2(new Date(Number(p[0]), Number(p[1]), 0).getDate()); }
  function tambahHari(t, n) { var p = t.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + n); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function selisihHari(a, b) { var x = a.split('-'), y = b.split('-'); return Math.round((Date.UTC(+y[0], +y[1] - 1, +y[2]) - Date.UTC(+x[0], +x[1] - 1, +x[2])) / 86400000) + 1; }
  function bulanIni() { return hariIni().slice(0, 7); }
  function tgl(s) { var p = s.split('-'); return Number(p[2]) + ' ' + BLN[Number(p[1]) - 1] + ' ' + p[0]; }
  function labelBulan(b) { var p = b.split('-'); return BULAN[Number(p[1]) - 1] + ' ' + p[0]; }
  function geser(b, n) {
    var p = b.split('-'), y = Number(p[0]), m = Number(p[1]) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + p2(m + 1);
  }
  function ringkas(n) {
    function f(x) { return String(Math.round(x * 10) / 10).replace('.', ','); }
    if (n >= 1e9) return f(n / 1e9) + ' miliar';
    if (n >= 1e6) return f(n / 1e6) + ' juta';
    if (n >= 1e3) return f(n / 1e3) + ' ribu';
    return String(n);
  }

  var store = {
    get: function () { try { return sessionStorage.getItem('bk_token'); } catch (e) { return null; } },
    set: function (v) { try { sessionStorage.setItem('bk_token', v); } catch (e) {} },
    del: function () { try { sessionStorage.removeItem('bk_token'); } catch (e) {} }
  };

  /* ---------- state ---------- */
  // Nominal kartu rata-rata: disimpan permanen di perangkat (localStorage),
  // tidak terhapus saat aplikasi ditutup atau logout; hilang hanya jika dikosongkan manual
  var nominalSimpan = {
    get: function () {
      try { return Number(localStorage.getItem('bk_nominal')) || 0; } catch (e) { return 0; }
    },
    set: function (v) {
      try {
        if (v) localStorage.setItem('bk_nominal', String(v));
        else localStorage.removeItem('bk_nominal');
      } catch (e) {}
    }
  };

  var state = {
    token: null, view: 'dashboard', bulan: bulanIni(),
    data: { masuk: [], keluar: [] },
    semua: { masuk: false, keluar: false },
    cari: { masuk: '', keluar: '' },
    edit: null, jenis: 'masuk', hapus: null, dash: null,
    rataRentang: { hari: 30, tagihan: nominalSimpan.get() }, keluarSemua: [],
    laporanRentang: { dari: bulanIni() + '-01', sampai: hariIni() }
  };
  var seq = 0, sibuk = 0;

  function busy(on) {
    sibuk += on ? 1 : -1;
    if (sibuk < 0) sibuk = 0;
    $('#load').hidden = sibuk === 0;
  }

  var tid;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(tid);
    tid = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- cache (tampil instan, perbarui di latar belakang) ---------- */
  var PREFIX = 'bk_c:';
  var cache = {
    mem: {},
    get: function (k) {
      if (this.mem[k]) return this.mem[k];
      try {
        var v = sessionStorage.getItem(PREFIX + k);
        if (v) { this.mem[k] = JSON.parse(v); return this.mem[k]; }
      } catch (e) {}
      return null;
    },
    set: function (k, v) {
      this.mem[k] = v;
      try { sessionStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) {}
    },
    bersih: function () {
      this.mem = {};
      try {
        Object.keys(sessionStorage).forEach(function (k) {
          if (k.indexOf(PREFIX) === 0) sessionStorage.removeItem(k);
        });
      } catch (e) {}
    }
  };
  function kunciTrx(j, bulan) { return 'trx:' + j + ':' + (bulan || 'all'); }
  function sama(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function jam() { var d = new Date(); return 'Diperbarui ' + p2(d.getHours()) + '.' + p2(d.getMinutes()); }
  function setUpd(t) { $('#upd').textContent = t; }

  /* ---------- pemanggil server ---------- */
  // diam = true: tanpa indikator loading (dipakai saat memperbarui di latar belakang)
  function panggil(diam, fn, args) {
    if (!diam) busy(true);
    return new Promise(function (resolve, reject) {
      var r = google.script.run
        .withSuccessHandler(function (res) { if (!diam) busy(false); resolve(res); })
        .withFailureHandler(function (err) {
          if (!diam) busy(false);
          var msg = (err && err.message) ? String(err.message) : String(err);
          if (msg.indexOf('SESI_HABIS') >= 0) { sesiBerakhir(); }
          reject(new Error(msg.replace(/^Error:\s*/, '')));
        });
      r[fn].apply(r, args);
    });
  }
  function api(fn) { return panggil(false, fn, Array.prototype.slice.call(arguments, 1)); }

  /* ---------- login / logout ---------- */
  function tampilLogin(pesan) {
    $('#app').hidden = true;
    $('#login').hidden = false;
    $('#loginErr').textContent = pesan || '';
    setTimeout(function () { $('#pw').focus(); }, 50);
  }
  function sesiBerakhir() {
    if ($('#login').hidden === false) return;
    state.token = null; store.del(); cache.bersih();
    $$('dialog[open]').forEach(function (d) { d.close(); });
    tampilLogin('Sesi berakhir. Silakan masuk lagi.');
  }
  function bukaAplikasi() {
    $('#login').hidden = true;
    $('#app').hidden = false;
    $('#bulan').value = state.bulan;
    tampil('dashboard');
  }

  $('#lihatPw').addEventListener('click', function () {
    var i = $('#pw'), tampak = i.type === 'password';
    i.type = tampak ? 'text' : 'password';
    this.textContent = tampak ? 'Sembunyikan' : 'Tampilkan';
  });

  $('#formLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('#pw').value;
    if (!pw) return;
    var btn = $('#btnLogin');
    btn.disabled = true; btn.textContent = 'Memeriksa...';
    $('#loginErr').textContent = '';
    api('login', pw).then(function (r) {
      if (r.ok) {
        state.token = r.token; store.set(r.token);
        $('#pw').value = '';
        bukaAplikasi();
      } else {
        $('#loginErr').textContent = r.pesan;
        $('#pw').select();
      }
    }).catch(function (err) {
      $('#loginErr').textContent = err.message || 'Tidak bisa terhubung ke server. Coba lagi.';
    }).then(function () {
      btn.disabled = false; btn.textContent = 'Masuk';
    });
  });

  function keluarAkun() {
    var t = state.token;
    state.token = null; store.del(); cache.bersih();
    if (t) google.script.run.logout(t);
    tampilLogin('');
  }

  /* ---------- navigasi ---------- */
  function tampil(view) {
    state.view = view;
    ['dashboard', 'masuk', 'keluar'].forEach(function (v) { $('#v-' + v).hidden = v !== view; });
    $$('[data-nav]').forEach(function (b) {
      if (b.getAttribute('data-nav') === view) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    $('#judul').textContent = JUDUL[view];
    $('#hero').hidden = view !== 'dashboard';
    window.scrollTo(0, 0);
    muat();
  }

  function muat(diam) {
    var my = ++seq;
    setUpd('Memperbarui...');

    if (state.view === 'dashboard') {
      var kk = kunciTrx('keluar', '');
      var cd = cache.get('dash'), ck = cache.get(kk);
      var ada = !!(cd && ck);
      if (ada) renderDashboard(cd, ck.items);
      else if (!$('#aPilih')) $('#hero').innerHTML = '<div class="lbl">Memuat saldo...</div>';

      Promise.all([
        panggil(ada || diam, 'getDashboard', [state.token, state.bulan]),
        panggil(ada || diam, 'getTransaksi', [state.token, 'keluar', ''])
      ]).then(function (r) {
        cache.set('dash', r[0]); cache.set(kk, r[1]);
        if (my !== seq) return;
        if (!ada || !sama(cd, r[0]) || !sama(ck, r[1])) renderDashboard(r[0], r[1].items);
        setUpd(jam());
        prefetch();
      }).catch(function (err) { gagalMuat(err, ada, my); });
      return;
    }

    var j = state.view;
    var key = kunciTrx(j, state.semua[j] ? '' : state.bulan);
    var c = cache.get(key);
    state.data[j] = c ? c.items : [];
    renderList(j);
    if (!c) $('#list-' + j).innerHTML = '<p class="empty">Memuat data...</p>';

    panggil(!!c || diam, 'getTransaksi', [state.token, j, state.semua[j] ? '' : state.bulan]).then(function (res) {
      cache.set(key, res);
      if (my !== seq) return;
      if (!c || !sama(c, res)) { state.data[j] = res.items; renderList(j); }
      setUpd(jam());
      prefetch();
    }).catch(function (err) { gagalMuat(err, !!c, my); });
  }

  // Ambil diam-diam data menu lain agar berpindah menu terasa instan
  function prefetch() {
    ['masuk', 'keluar'].forEach(function (j) {
      var bln = state.semua[j] ? '' : state.bulan;
      var key = kunciTrx(j, bln);
      if (cache.get(key)) return;
      panggil(true, 'getTransaksi', [state.token, j, bln]).then(function (res) { cache.set(key, res); }).catch(function () {});
    });
  }

  function gagalMuat(err, adaCache, my) {
    if (err && /SESI_HABIS/.test(err.message)) return;
    if (my === seq) setUpd(adaCache ? 'Tidak terhubung, memakai data tersimpan' : 'Gagal memuat data');
    if (!adaCache) toast(err && err.message ? err.message : 'Terjadi kesalahan.');
  }

  function galat(err) {
    if (err && /SESI_HABIS/.test(err.message)) return;
    toast(err && err.message ? err.message : 'Terjadi kesalahan.');
  }

  /* ---------- render dashboard ---------- */
  function renderDashboard(d, keluarSemua) {
    var saldoBulan = (typeof d.saldoBulan === 'number') ? d.saldoBulan : d.masukBulan - d.keluarBulan;
    var tot = d.masukBulan + d.keluarBulan;
    var pin = tot ? (d.masukBulan / tot) * 100 : 0;
    var split = tot
      ? '<i class="a" style="width:' + pin + '%"></i><i class="b" style="width:' + (100 - pin) + '%"></i>'
      : '';

    $('#hero').innerHTML =
      '<div class="lbl">Saldo ' + esc(labelBulan(d.bulan)) + '</div>' +
      '<div class="num">' + rpS(saldoBulan) + '</div>' +
      '<div class="split">' + split + '</div>' +
      '<div class="legend"><div class="a"><small>Uang masuk</small><b>' + rp(d.masukBulan) + '</b></div>' +
      '<div class="r"><small>Uang keluar</small><b>' + rp(d.keluarBulan) + '</b></div></div>';

    state.dash = d;
    state.keluarSemua = keluarSemua;

    function kartu(judul, idDari, idSampai, idHasil, r) {
      return '<div class="panel"><h2>' + judul + '</h2>' +
        '<div class="rng"><div class="field"><label for="' + idDari + '">Dari tanggal</label><input class="input" type="date" id="' + idDari + '" value="' + esc(r.dari) + '"></div>' +
        '<div class="field"><label for="' + idSampai + '">Sampai tanggal</label><input class="input" type="date" id="' + idSampai + '" value="' + esc(r.sampai) + '"></div></div>' +
        '<div id="' + idHasil + '"></div></div>';
    }

    // Pilihan jangka waktu 1 sampai maks hari
    function opsiHari(maks, terpilih) {
      var opsi = '';
      for (var i = 1; i <= maks; i++) {
        opsi += '<option value="' + i + '"' + (i === terpilih ? ' selected' : '') + '>' + i + ' hari</option>';
      }
      return opsi;
    }

    function kartuRata(r) {
      return '<div class="panel">' +
        '<div class="field"><label for="aNominal">Nominal (Rp)</label>' +
        '<input class="input" id="aNominal" inputmode="numeric" autocomplete="off" placeholder="0" value="' + (r.tagihan ? nf.format(r.tagihan) : '') + '"></div>' +
        '<div class="field"><label for="aPilih">Jangka waktu</label>' +
        '<select class="input" id="aPilih">' + opsiHari(30, r.hari) + '</select></div>' +
        '<div id="aHasil"></div></div>';
    }

    if (!$('#aPilih')) $('#v-dashboard').innerHTML =
      kartuRata(state.rataRentang) +
      kartu('Laporan pengeluaran harian', 'lDari', 'lSampai', 'lHasil', state.laporanRentang);
    hitungRata();
    hitungLaporan();
  }

  var HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
  function namaHari(t) { var p = t.split('-'); return HARI[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()]; }

  function hitungLaporan() {
    var box = $('#lHasil'), r = state.laporanRentang;
    if (!box) return;
    if (!r.dari || !r.sampai) { box.innerHTML = '<p class="note">Isi kedua tanggal untuk melihat laporan.</p>'; return; }
    if (selisihHari(r.dari, r.sampai) < 1) { box.innerHTML = '<p class="err">Tanggal akhir harus sama dengan atau setelah tanggal awal.</p>'; return; }

    var per = {}, jml = {}, total = 0;
    (state.keluarSemua || []).forEach(function (t) {
      if (t.tanggal < r.dari || t.tanggal > r.sampai) return;
      if (KECUALI_LAPORAN.indexOf(String(t.kategori).trim().toLowerCase()) >= 0) return;
      per[t.tanggal] = (per[t.tanggal] || 0) + t.jumlah;
      jml[t.tanggal] = (jml[t.tanggal] || 0) + 1;
      total += t.jumlah;
    });
    var hari = Object.keys(per).sort().reverse();
    if (!hari.length) { box.innerHTML = ''; return; }

    box.innerHTML = '<ul class="lap">' + hari.map(function (h) {
      return '<li><div class="t"><b>' + esc(namaHari(h)) + ', ' + esc(tgl(h)) + '</b><small>' + jml[h] + ' transaksi</small></div>' +
        '<span class="amt out">' + rp(per[h]) + '</span></li>';
    }).join('') + '</ul>' +
    '<div class="lap-total"><span>Total ' + hari.length + ' hari</span><span class="neg">' + rp(total) + '</span></div>';
  }

  function hitungRata() {
    var box = $('#aHasil');
    if (!box) return;
    var n = Number(state.rataRentang.hari) || 1;
    var tagihan = Number(state.rataRentang.tagihan) || 0;
    if (!tagihan) { box.innerHTML = '<p class="note">Isi nominal untuk melihat hasilnya.</p>'; return; }
    var nilai = Math.ceil(tagihan / n);
    box.innerHTML = '<div class="avg neg">' + rp(nilai) + '<small>per hari</small></div>';
  }

  /* ---------- daftar transaksi ---------- */
  function bangunList(j) {
    var m = j === 'masuk';
    $('#v-' + j).innerHTML =
      '<div class="bar"><div class="sum ' + (m ? 'in' : 'out') + '"><small id="lbl-' + j + '"></small><b id="sum-' + j + '">Rp 0</b></div>' +
      '<button class="btn small ' + (m ? 'in' : 'out') + '" data-tambah="' + j + '">' + (m ? 'Tambah uang masuk' : 'Tambah uang keluar') + '</button></div>' +
      '<div class="tools"><input class="input" id="q-' + j + '" type="search" placeholder="Cari kategori atau keterangan" aria-label="Cari transaksi">' +
      '<button class="chip" id="all-' + j + '" aria-pressed="false">Semua bulan</button></div>' +
      '<div class="table" id="list-' + j + '"></div>';

    $('#q-' + j).addEventListener('input', function () { state.cari[j] = this.value; renderList(j); });
    $('#all-' + j).addEventListener('click', function () {
      state.semua[j] = !state.semua[j];
      this.setAttribute('aria-pressed', state.semua[j] ? 'true' : 'false');
      muat();
    });
  }

  function renderList(j) {
    var q = state.cari[j].trim().toLowerCase();
    var items = state.data[j].filter(function (t) {
      return !q || (t.kategori + ' ' + t.keterangan).toLowerCase().indexOf(q) >= 0;
    });
    var total = items.reduce(function (a, t) { return a + t.jumlah; }, 0);
    var nama = j === 'masuk' ? 'uang masuk' : 'uang keluar';
    var rentang = state.semua[j] ? 'seluruh waktu' : labelBulan(state.bulan);

    $('#lbl-' + j).textContent = 'Total ' + nama + ', ' + rentang + ' (' + items.length + ' catatan)';
    $('#sum-' + j).textContent = rp(total);

    var box = $('#list-' + j);
    if (!items.length) {
      box.innerHTML = '<p class="empty">' + (q
        ? 'Tidak ada catatan yang cocok dengan pencarian.'
        : 'Belum ada catatan ' + nama + ' untuk ' + esc(rentang) + '. Tekan tombol Tambah untuk mencatat.') + '</p>';
      return;
    }

    var per = {};
    items.forEach(function (t) { (per[t.tanggal] = per[t.tanggal] || []).push(t); });
    var tanggalUrut = Object.keys(per).sort().reverse();
    var m = j === 'masuk';

    box.innerHTML = tanggalUrut.map(function (tg) {
      var baris = per[tg].slice().sort(function (a, b) {
        return String(a.keterangan || '').toLowerCase().localeCompare(String(b.keterangan || '').toLowerCase(), 'id');
      });
      var jmlTgl = per[tg].length;
      var totalTgl = per[tg].reduce(function (a, t) { return a + t.jumlah; }, 0);
      // total per tanggal hanya bila ada lebih dari satu transaksi
      var totalHtml = jmlTgl > 1
        ? '<span class="amt ' + (m ? 'in' : 'out') + '">Total ' + (m ? '+' : '\u2212') + rp(totalTgl) + '</span>'
        : '';
      return '<div class="grp"><div class="grp-date"><span>' + esc(namaHari(tg)) + ', ' + esc(tgl(tg)) + '</span>' + totalHtml + '</div>' +
        baris.map(function (t) {
          return '<div class="row">' +
            '<div class="r-main"><b>' + esc(t.kategori) + '</b>' + (t.keterangan ? '<span>' + esc(t.keterangan) + '</span>' : '') + '</div>' +
            '<div class="r-amt amt ' + (m ? 'in' : 'out') + '">' + (m ? '+' : '\u2212') + rp(t.jumlah) + '</div>' +
            '<div class="r-act"><button class="lnk" data-aksi="ubah" data-id="' + esc(t.id) + '">Ubah</button>' +
            '<button class="lnk del" data-aksi="hapus" data-id="' + esc(t.id) + '">Hapus</button></div></div>';
        }).join('') + '</div>';
    }).join('');
  }

  /* ---------- form transaksi ---------- */
  function bukaForm(j, item) {
    state.jenis = j; state.edit = item || null;
    $('#fTitle').textContent = (item ? 'Ubah ' : 'Tambah ') + (j === 'masuk' ? 'uang masuk' : 'uang keluar');
    $('#fTgl').value = item ? item.tanggal : hariIni();
    $('#fKat').value = item ? item.kategori : '';
    $('#fJml').value = item ? nf.format(item.jumlah) : '';
    $('#fKet').value = item ? item.keterangan : '';
    $('#fErr').textContent = '';

    var pakai = {}, opsi = [];
    KATEGORI[j].concat(state.data[j].map(function (t) { return t.kategori; })).forEach(function (k) {
      if (!pakai[k]) { pakai[k] = 1; opsi.push(k); }
    });
    $('#dlKat').innerHTML = opsi.map(function (k) { return '<option value="' + esc(k) + '">'; }).join('');

    $('#dlgTrx').showModal();
    $('#fKat').focus();
  }

  $('#fJml').addEventListener('input', function () {
    var d = this.value.replace(/\D/g, '').replace(/^0+/, '');
    this.value = d ? nf.format(Number(d)) : '';
  });

  $('#formTrx').addEventListener('submit', function (e) {
    e.preventDefault();
    var jumlah = Number($('#fJml').value.replace(/\D/g, ''));
    var kategori = $('#fKat').value.trim();
    if (!kategori) { $('#fErr').textContent = 'Kategori wajib diisi.'; return; }
    if (!jumlah) { $('#fErr').textContent = 'Jumlah harus lebih dari 0.'; return; }
    if (!$('#fTgl').value) { $('#fErr').textContent = 'Tanggal wajib diisi.'; return; }

    var btn = $('#fSimpan'); btn.disabled = true; btn.textContent = 'Menyimpan...';
    var j = state.jenis;
    api('simpanTransaksi', state.token, j, {
      id: state.edit ? state.edit.id : '',
      tanggal: $('#fTgl').value, kategori: kategori,
      keterangan: $('#fKet').value.trim(), jumlah: jumlah
    }).then(function () {
      $('#dlgTrx').close();
      toast(state.edit ? 'Perubahan disimpan' : 'Catatan disimpan');
      var item = {
        id: state.edit ? state.edit.id : 'baru' + Date.now(),
        tanggal: $('#fTgl').value, kategori: kategori,
        keterangan: $('#fKet').value.trim(), jumlah: jumlah, urut: 1e9
      };
      var t = item.tanggal.slice(0, 7);
      cache.bersih();
      if (!state.semua[j] && t !== state.bulan) {
        state.bulan = t; $('#bulan').value = t;
      } else {
        // tampilkan hasilnya segera, lalu selaraskan dengan server di latar belakang
        var daftar = state.data[j].filter(function (x) { return x.id !== item.id; });
        if (state.semua[j] || t === state.bulan) daftar.push(item);
        daftar.sort(function (a, b) { return a.tanggal !== b.tanggal ? (a.tanggal < b.tanggal ? 1 : -1) : b.urut - a.urut; });
        cache.set(kunciTrx(j, state.semua[j] ? '' : state.bulan), { items: daftar });
      }
      muat();
    }).catch(function (err) {
      $('#fErr').textContent = err.message;
    }).then(function () {
      btn.disabled = false; btn.textContent = 'Simpan';
    });
  });

  $('#delOk').addEventListener('click', function () {
    if (!state.hapus) return;
    var h = state.hapus, btn = this;
    btn.disabled = true;
    api('hapusTransaksi', state.token, h.jenis, h.id).then(function () {
      $('#dlgDel').close(); toast('Catatan dihapus');
      var sisa = state.data[h.jenis].filter(function (x) { return x.id !== h.id; });
      cache.bersih();
      cache.set(kunciTrx(h.jenis, state.semua[h.jenis] ? '' : state.bulan), { items: sisa });
      muat();
    }).catch(function (err) {
      $('#dlgDel').close(); galat(err);
    }).then(function () { btn.disabled = false; });
  });

  /* ---------- ganti password ---------- */
  $('#formPw').addEventListener('submit', function (e) {
    e.preventDefault();
    var lama = $('#pLama').value, baru = $('#pBaru').value, ulang = $('#pUlang').value;
    if (baru.length < 6) { $('#pErr').textContent = 'Password baru minimal 6 karakter.'; return; }
    if (baru !== ulang) { $('#pErr').textContent = 'Pengulangan password tidak sama.'; return; }
    var btn = $('#pSimpan'); btn.disabled = true; btn.textContent = 'Menyimpan...';
    api('gantiPassword', state.token, lama, baru).then(function () {
      $('#dlgPw').close(); toast('Password diganti');
    }).catch(function (err) {
      $('#pErr').textContent = err.message;
    }).then(function () {
      btn.disabled = false; btn.textContent = 'Simpan password';
    });
  });

  /* ---------- event global ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-nav],[data-tambah],[data-aksi],[data-tutup],.js-pw,.js-out');
    if (el) {
      if (el.hasAttribute('data-nav')) { tampil(el.getAttribute('data-nav')); return; }
      if (el.hasAttribute('data-tambah')) { bukaForm(el.getAttribute('data-tambah')); return; }
      if (el.hasAttribute('data-tutup')) { el.closest('dialog').close(); return; }
      if (el.classList.contains('js-pw')) {
        $('#formPw').reset(); $('#pErr').textContent = '';
        $('#dlgPw').showModal(); $('#pLama').focus(); return;
      }
      if (el.classList.contains('js-out')) { keluarAkun(); return; }
      if (el.hasAttribute('data-aksi')) {
        var j = state.view, id = el.getAttribute('data-id');
        var item = state.data[j].filter(function (t) { return t.id === id; })[0];
        if (!item) return;
        if (id.indexOf('baru') === 0) { toast('Sedang menyinkronkan, coba lagi sebentar.'); return; }
        if (el.getAttribute('data-aksi') === 'ubah') { bukaForm(j, item); return; }
        state.hapus = { jenis: j, id: id };
        $('#delInfo').textContent = item.kategori + ' sebesar ' + rp(item.jumlah) + ' pada ' + tgl(item.tanggal) + '.';
        $('#dlgDel').showModal();
      }
      return;
    }
    // klik di area gelap (backdrop) menutup dialog
    if (e.target.tagName === 'DIALOG') e.target.close();
  });

  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'lDari' || id === 'lSampai') {
      state.laporanRentang = { dari: $('#lDari').value, sampai: $('#lSampai').value };
      hitungLaporan();
    } else if (id === 'aPilih') {
      state.rataRentang.hari = Number($('#aPilih').value) || 1;
      hitungRata();
    }
  });

  // Nominal tagihan: tampil dengan pemisah ribuan, hasil dihitung saat mengetik
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'aNominal') return;
    var d = e.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 13);
    e.target.value = d ? nf.format(Number(d)) : '';
    state.rataRentang.tagihan = d ? Number(d) : 0;
    nominalSimpan.set(state.rataRentang.tagihan);
    hitungRata();
  });

  $('#prev').addEventListener('click', function () { ubahBulan(geser(state.bulan, -1)); });
  $('#next').addEventListener('click', function () { ubahBulan(geser(state.bulan, 1)); });
  $('#bulan').addEventListener('change', function () {
    if (/^\d{4}-\d{2}$/.test(this.value)) ubahBulan(this.value);
  });
  function ubahBulan(b) { state.bulan = b; $('#bulan').value = b; muat(); }

  /* ---------- mulai ---------- */
  bangunList('masuk');
  bangunList('keluar');

  var lama = store.get();
  if (lama) {
    if (cache.get('dash')) {
      // ada data tersimpan: buka langsung, sesi diperiksa lewat pembaruan latar belakang
      state.token = lama; bukaAplikasi();
    } else {
      api('cekSesi', lama).then(function (r) {
        if (r.ok) { state.token = lama; bukaAplikasi(); }
        else store.del();
      }).catch(function () {});
    }
  }

  // Pembaruan otomatis di latar belakang
  function segarkan() {
    if (!state.token || $('#app').hidden || document.hidden) return;
    if ($('dialog[open]')) return;
    muat(true);
  }
  setInterval(segarkan, 30000);
  document.addEventListener('visibilitychange', segarkan);
  window.addEventListener('online', segarkan);
})();
</script>
</body>
</html>
